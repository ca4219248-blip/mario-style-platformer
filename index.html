<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Pixel Bros — A Mario-style Platformer</title>
  <meta name="description" content="An open source Mario-style platformer game built with vanilla JavaScript and HTML5 Canvas." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <h1>SUPER PIXEL BROS</h1>
    <canvas id="game" width="960" height="540"></canvas>
    <div class="controls-hint">
      <span><b>← →</b> / <b>A D</b> — Move</span>
      <span><b>Space</b> / <b>↑</b> / <b>W</b> — Jump</span>
      <span><b>Enter</b> — Start / Restart</span>
    </div>
    <footer>
      Made with vanilla JS + HTML5 Canvas ·
      <a href="https://github.com/ca4219248-blip/mario-style-platformer" target="_blank" rel="noopener">Source on GitHub</a> · MIT License
    </footer>
  </div>
  <script src="game.js"></script>
</body>
</html>
